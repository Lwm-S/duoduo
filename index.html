<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日程管理苏苏崽">
<meta name="theme-color" content="#fdf6ee">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>日程管理苏苏崽</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#fdf6ee; --card:#fff; --line:#efe3d4; --ink:#3b3229; --dim:#a2937f;
    --warm:#e08b4c; --warm-soft:#fdf0e2; --green:#57a86f; --green-soft:#eef7f0;
    --blue:#5e8fc4; --blue-soft:#eef4fa; --now:#e2574c;
  }
  body{
    margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  .wrap{max-width:560px;margin:0 auto}

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .cat{font-size:26px;line-height:1}
  .title{font-size:19px;font-weight:700;letter-spacing:.5px}
  .title small{display:block;font-size:12px;font-weight:400;color:var(--dim);letter-spacing:0}
  .gear{margin-left:auto;font-size:19px;color:var(--dim);cursor:pointer;padding:6px}

  .tabs{display:flex;gap:6px;background:#f3e9dc;border-radius:12px;padding:4px;margin-bottom:14px}
  .tab{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--dim);
       padding:8px 0;border-radius:9px;cursor:pointer;transition:all .15s}
  .tab.on{background:#fff;color:var(--warm);box-shadow:0 1px 4px rgba(180,150,110,.12)}

  .composer{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(180,150,110,.06)}
  textarea{width:100%;border:0;outline:0;resize:none;font-family:inherit;font-size:15.5px;
           color:var(--ink);background:transparent;line-height:1.6;min-height:56px;padding:2px 0}
  textarea::placeholder{color:#c4b6a4}
  .btns{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;border:0;border-radius:12px;padding:11px 8px;font-family:inherit;font-size:14.5px;
       font-weight:600;cursor:pointer;transition:transform .12s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn-a{background:var(--warm);color:#fff}
  .btn-b{background:var(--warm-soft);color:var(--warm)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-size:12.5px;color:var(--dim);background:#f5ece0;border-radius:20px;padding:5px 11px;cursor:pointer}
  .chip:active{background:#eee0cf}

  .sect{margin-top:24px}
  .sect h2{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:1px;margin:0 0 10px 4px}
  .sect h2 span{font-weight:400;letter-spacing:0}

  /* ---------- 事件池 ---------- */
  .pool{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 13px 10px}
  .pgroup{margin-bottom:10px}
  .pgroup:last-of-type{margin-bottom:4px}
  .pglbl{font-size:11px;color:#bcae9c;letter-spacing:1px;margin:0 0 5px 2px}
  .pchips{display:flex;flex-wrap:wrap;gap:6px}
  .ec{
    display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;
    border-radius:10px;padding:6px 10px;cursor:pointer;border:1.5px solid transparent;
    background:var(--c-bg);color:var(--c-fg);transition:transform .12s,box-shadow .15s;
  }
  .ec:active{transform:scale(.95)}
  .ec.on{box-shadow:0 0 0 2.5px var(--warm);transform:scale(1.04)}
  .ec .em{font-size:14px;line-height:1}
  .ec.add{background:#f5ece0;color:var(--dim);font-weight:400}
  .poolhint{font-size:11.5px;color:#bcae9c;text-align:center;margin-top:8px;line-height:1.5}

  /* ---------- 24 格 ---------- */
  .grid{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;overflow:hidden}
  .hr{display:flex;align-items:stretch;gap:9px;padding:2px 0}
  .hlbl{
    width:34px;flex:none;font-size:11.5px;color:#bcae9c;font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:flex-end;padding-right:2px;
  }
  .hr.now .hlbl{color:var(--now);font-weight:700}
  .hcell{
    flex:1;min-width:0;height:38px;border-radius:9px;border:1.5px dashed #ece2d4;
    display:flex;align-items:center;padding:0 11px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .hcell:active{transform:scale(.99)}
  .hcell.empty::after{content:"＋";color:#ded2c2;font-size:14px}
  .hcell[data-c]{border-style:solid;border-color:transparent}
  .hcell .txt{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
              white-space:nowrap;display:flex;align-items:center;gap:5px}
  .hr.now .hcell{box-shadow:inset 0 0 0 1.5px var(--now)}
  .gridfoot{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #f5ece0}
  .gridfoot .cnt{font-size:12px;color:var(--dim)}
  .gridfoot .btn{flex:none;padding:7px 13px;font-size:12.5px;background:#f5ece0;color:#8a7a66}

  /* 分类配色 */
  [data-c=night]{--c-bg:#eceefa;--c-fg:#6b78a6}
  [data-c=meal] {--c-bg:#fdf1e0;--c-fg:#b5783a}
  [data-c=body] {--c-bg:#e9f4ec;--c-fg:#4c8a63}
  [data-c=study]{--c-bg:#e9f1fa;--c-fg:#4a7bb0}
  [data-c=job]  {--c-bg:#fdeceb;--c-fg:#b8564f}
  [data-c=life] {--c-bg:#f3ecfa;--c-fg:#7a64aa}

  .task{display:flex;gap:12px;align-items:flex-start;background:var(--card);
        border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px}
  .task .box{flex:none;width:22px;height:22px;margin-top:1px;border:2px solid #d8c9b6;
             border-radius:8px;position:relative;cursor:pointer;transition:all .16s}
  .task .box::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);
    transition:transform .2s cubic-bezier(.4,1.7,.6,1)}
  .task.on{background:var(--green-soft);border-color:#cfe6d7}
  .task.on .box{background:var(--green);border-color:var(--green)}
  .task.on .box::after{transform:rotate(45deg) scale(1)}
  .t-body{flex:1;min-width:0}
  .t-title{font-size:15px;word-break:break-word}
  .task.on .t-title{color:#84a892;text-decoration:line-through;text-decoration-color:#bcd8c5}
  .t-meta{font-size:12.5px;color:var(--dim);margin-top:3px}
  .t-due{color:var(--warm);font-weight:600}
  .t-due.late{color:#d05a5a}
  .t-note{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.55}
  .del{flex:none;color:#d5c8b8;font-size:17px;cursor:pointer;padding:0 2px;line-height:1.2}
  .step{background:var(--blue-soft);border-color:#d8e5f2}
  .step .box{border-color:#a9c3dd}
  .step.on{background:var(--green-soft);border-color:#cfe6d7}
  .empty{color:#c4b6a4;font-size:14px;text-align:center;padding:26px 0}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translate(-50%,20px);
    background:#3b3229;color:#fff;font-size:14px;padding:11px 20px;border-radius:24px;
    opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center;z-index:99}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .sheet{position:fixed;inset:0;background:rgba(59,50,41,.35);display:none;z-index:100;align-items:flex-end}
  .sheet.show{display:flex}
  .sheet-in{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;
            padding:22px 20px calc(env(safe-area-inset-bottom) + 24px)}
  .sheet-in h3{margin:0 0 4px;font-size:16px}
  .sheet-in p{font-size:13px;color:var(--dim);margin:0 0 14px;line-height:1.7}
  input[type=password],input[type=text].f{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
  input[type=password]:focus,input[type=text].f:focus{border-color:var(--warm)}
  .sheet-in .btn{margin-top:14px;width:100%}
  .loading{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
  .pop{animation:pop .35s ease}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="cat">🐱</div>
    <div class="title">日程管理苏苏崽<small id="today">—</small></div>
    <div class="gear" id="gear">⚙️</div>
  </header>

  <div class="tabs">
    <div class="tab" data-view="grid">24 格</div>
    <div class="tab on" data-view="list">列表</div>
  </div>

  <div class="composer">
    <textarea id="inp" rows="2" placeholder="跟苏苏说你要做什么…&#10;比如「9点到11点 晨学编程」"></textarea>
    <div class="btns">
      <button class="btn btn-a" id="add">建成任务</button>
      <button class="btn btn-b" id="split">帮我拆解</button>
    </div>
    <div class="chips">
      <span class="chip">9点到11点 晨学编程</span>
      <span class="chip">明天下午3点 小组开会</span>
      <span class="chip">我该找工作了</span>
    </div>
  </div>

  <div id="lists"></div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h3>DeepSeek API Key</h3>
    <p>只存在这台设备本地，不会上传到任何地方。<br>苏苏用它来帮明神建任务和拆解。</p>
    <input type="password" id="keyinp" placeholder="sk-...">
    <button class="btn btn-a" id="savekey">保存</button>
  </div>
</div>

<script>
const KEY_STORE = "duoduo-v3";

/* ============ 事件池：明神能做的事 ============
   这些是从明神手上的材料整理出来的（英语 / AI Agent / 简历面试 /
   短线交易 / 唱歌 / 健身 / 编程）。要加要减，直接改这里。 */
const GROUPS = [
  { k:"night", g:"睡觉休息", items:[
    ["sleep","😴","睡觉"], ["nap","🛏️","午休"], ["rest","☕","歇一会儿"],
  ]},
  { k:"meal", g:"吃喝洗漱", items:[
    ["bfast","🍳","早餐"], ["lunch","🍚","午饭"], ["dinner","🍜","晚饭"], ["wash","🚿","洗漱"],
  ]},
  { k:"body", g:"身体", items:[
    ["gym","🏋️","健身"], ["cardio","🏃","有氧 / 散步"], ["stretch","🧘","拉伸"],
  ]},
  { k:"study", g:"学习", items:[
    ["code","💻","编程"], ["eng","🔤","英语"], ["agent","🤖","AI Agent"], ["course","📘","AI 课程"],
  ]},
  { k:"job", g:"求职", items:[
    ["cv","📄","改简历"], ["apply","📮","投简历"], ["qa","🎤","刷面试题"], ["mock","🗣️","模拟面试"],
  ]},
  { k:"life", g:"自己", items:[
    ["read","📖","看书"], ["sing","🎵","唱歌"], ["trade","📈","短线交易"],
    ["chore","🧹","家务"], ["fun","🎮","放松"], ["review","✅","复盘打卡"],
  ]},
];
const EV = {};
GROUPS.forEach(gr => gr.items.forEach(([id, em, t]) => EV[id] = { id, em, t, c: gr.k }));

let S = load();
let view = "list";
let brush = null;          // 当前选中的贴纸

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY_STORE)) || {}; } catch (e) {}
  return {
    tasks: s.tasks || [], steps: s.steps || [], apiKey: s.apiKey || "",
    grid: s.grid || {}, custom: s.custom || [],
  };
}
function save() { try { localStorage.setItem(KEY_STORE, JSON.stringify(S)); } catch (e) {} }

const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayGrid = () => (S.grid[todayStr()] = S.grid[todayStr()] || {});

function fmtWhen(t) {
  const s = t.start && new Date(t.start);
  if (!s || isNaN(s)) return null;
  const e = t.end && new Date(t.end);
  const hasEnd = e && !isNaN(e) && e > s;
  const day = ymd(s) === todayStr() ? "今天"
            : (ymd(s) === ymd(new Date(Date.now() + 864e5)) ? "明天" : `${s.getMonth()+1}月${s.getDate()}日`);
  return hasEnd ? `${day} ${hhmm(s)}–${hhmm(e)}` : `${day} ${hhmm(s)}`;
}
const isLate = t => t.start && !t.done && new Date(t.end || t.start) < new Date();

function toast(msg, ms = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), ms);
}

/* ---------- AI ---------- */
async function askAI(system, user) {
  if (!S.apiKey) { openSheet(); throw new Error("还没有填 API Key 喵"); }
  const r = await fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.apiKey },
    body: JSON.stringify({
      model: "deepseek-chat",
      messages: [{ role: "system", content: system }, { role: "user", content: user }],
      response_format: { type: "json_object" },
      temperature: 0.3,
    }),
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(r.status === 401 ? "API Key 不对喵" : `请求失败 ${r.status}: ${txt.slice(0, 90)}`);
  }
  const d = await r.json();
  return JSON.parse(d.choices[0].message.content);
}

function nowStr() {
  const d = new Date();
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return `${ymd(d)} ${wd} ${hhmm(d)}`;
}

const SYS_TASK = `你是日程解析助手。把用户的一句话解析成结构化日程。
当前时间：{{NOW}}

只返回 JSON，格式：
{"tasks":[{"title":"标题","start":"YYYY-MM-DDTHH:mm","end":"YYYY-MM-DDTHH:mm","note":"补充说明或空字符串"}]}

规则：
- 用户说了**时间段**（「9点到11点」「上午9-11点」）→ start 和 end 都要填
- 只说了**时间点**（「下午3点开会」）→ 只填 start，end 填空字符串 ""
- 时间换算成绝对时间：今天/明天/后天/周X 都要算成具体日期
- 只说了日期没说钟点 → start 用 09:00；只说了「晚上」→ 20:00
- 完全没提时间 → start 和 end 都填空字符串 ""
- 一句话里有多件事就拆成多个 task
- title 精简到 15 字以内，去掉时间词
- end 必须晚于 start
- 不要问用户问题，直接给结果`;

const SYS_SPLIT = `用户想做一件大事，但动不了。你的工作是把这件事砸成小石子。
当前时间：{{NOW}}

只返回 JSON，格式：
{"steps":[{"title":"动作","why":"为什么这步有用"}]}

规则：
- 3 到 5 步，全部是「今天就能做完」的
- 第一步必须特别小 —— 小到不需要意志力就能开始（例：「打开电脑，打开那个文件，看 10 分钟」「穿上鞋，走到楼下」）
- 每一步都要是具体动作，不要「制定计划」「评估现状」这种空话
- 不要励志，不要安慰，不要说「你一定可以」——只给动作
- title 15 字以内，why 30 字以内`;

/* ---------- 渲染 ---------- */
function render(popId) {
  document.getElementById("today").textContent =
    new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" });
  if (view === "grid") renderGrid();
  else renderList();
  if (popId) {
    const el = document.querySelector(`[data-id="${popId}"]`);
    if (el) el.classList.add("pop");
  }
}

/* ---------- 24 格 ---------- */
function allEvents() {
  const out = {};
  Object.assign(out, EV);
  S.custom.forEach(c => out[c.id] = c);
  return out;
}

function renderGrid() {
  const evs = allEvents();
  const g = todayGrid();
  const curH = new Date().getHours();

  let pool = "";
  for (const gr of GROUPS) {
    pool += `<div class="pgroup"><div class="pglbl">${gr.g}</div><div class="pchips">`
         +  gr.items.map(([id, em, t]) =>
              `<span class="ec ${brush === id ? "on" : ""}" data-c="${gr.k}" data-pick="${id}">
                 <span class="em">${em}</span>${t}</span>`).join("")
         +  `</div></div>`;
  }
  if (S.custom.length) {
    pool += `<div class="pgroup"><div class="pglbl">我自己加的</div><div class="pchips">`
         +  S.custom.map(c =>
              `<span class="ec ${brush === c.id ? "on" : ""}" data-c="${c.c}" data-pick="${c.id}">
                 <span class="em">${c.em}</span>${esc(c.t)}</span>`).join("")
         +  `</div></div>`;
  }
  pool += `<div class="pchips"><span class="ec add" id="addEv">＋ 加一个</span></div>`;

  let rows = "";
  for (let h = 0; h < 24; h++) {
    const id = g[h];
    const ev = id ? evs[id] : null;
    rows += `<div class="hr ${h === curH ? "now" : ""}">
      <div class="hlbl">${pad(h)}</div>
      <div class="hcell ${ev ? "" : "empty"}" data-h="${h}" ${ev ? `data-c="${ev.c}"` : ""}>
        ${ev ? `<span class="txt"><span class="em">${ev.em}</span>${esc(ev.t)}</span>` : ""}
      </div>
    </div>`;
  }

  const used = Object.keys(g).filter(k => g[k]).length;

  document.getElementById("lists").innerHTML =
    `<div class="sect">
       <h2>事件池 <span>· 点一个，再去下面点格子贴上去</span></h2>
       <div class="pool">${pool}
         <div class="poolhint">选中一个贴纸 → 点格子贴上（可以连着点好几格）<br>没选贴纸时，点已贴的格子 = 擦掉</div>
       </div>
     </div>
     <div class="sect">
       <h2>今天 24 格 <span>· 已排 ${used}/24</span></h2>
       <div class="grid">${rows}
         <div class="gridfoot">
           <div class="cnt">${brush ? `正在贴：${evs[brush].em} ${evs[brush].t}` : "还没选贴纸"}</div>
           <button class="btn" id="clearGrid">清空今天</button>
         </div>
       </div>
     </div>`;
}

function renderList() {
  const open = S.tasks.filter(t => !t.done);
  const today = open.filter(t => !t.start || ymd(new Date(t.start)) <= todayStr());
  const later = open.filter(t => t.start && ymd(new Date(t.start)) > todayStr());
  const done = S.tasks.filter(t => t.done);
  const steps = S.steps.filter(s => !s.done);
  const stepsDone = S.steps.filter(s => s.done);

  let html = "";
  if (steps.length) {
    html += `<div class="sect"><h2>苏苏帮明神砸开的石子 <span>· 今天从第一步开始</span></h2>`
         +  steps.map(t => taskHTML(t, "step")).join("") + `</div>`;
  }
  html += `<div class="sect"><h2>今天</h2>`
       +  (today.length ? today.map(t => taskHTML(t)).join("") : `<div class="empty">今天还没有安排喵</div>`)
       +  `</div>`;
  if (later.length) html += `<div class="sect"><h2>以后</h2>` + later.map(t => taskHTML(t)).join("") + `</div>`;
  const allDone = done.concat(stepsDone);
  if (allDone.length) {
    html += `<div class="sect"><h2>已完成 <span>· ${allDone.length} 件</span></h2>`
         +  allDone.slice(-12).reverse().map(t => taskHTML(t)).join("") + `</div>`;
  }
  document.getElementById("lists").innerHTML = html;
}

function taskHTML(t, cls = "") {
  const when = fmtWhen(t);
  const late = isLate(t);
  return `<div class="task ${cls} ${t.done ? "on" : ""}" data-id="${t.id}">
    <div class="box" data-act="toggle"></div>
    <div class="t-body">
      <div class="t-title">${esc(t.title)}</div>
      ${when ? `<div class="t-meta"><span class="t-due ${late ? "late" : ""}">${late ? "⚠ " : ""}${when}</span></div>` : ""}
      ${t.note ? `<div class="t-note">${esc(t.note)}</div>` : ""}
      ${t.why ? `<div class="t-note">${esc(t.why)}</div>` : ""}
    </div>
    <div class="del" data-act="del">×</div>
  </div>`;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- 交互 ---------- */
document.getElementById("lists").addEventListener("click", e => {
  // 事件池：选贴纸
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const id = pick.dataset.pick;
    brush = (brush === id) ? null : id;
    renderGrid();
    return;
  }
  if (e.target.id === "addEv") {
    const name = prompt("加一个你自己要做的事（名字）");
    if (name && name.trim()) {
      const em = prompt("配个 emoji（可留空）", "⭐") || "⭐";
      S.custom.push({ id: "c" + uid(), em: em.trim().slice(0, 2) || "⭐", t: name.trim().slice(0, 8), c: "life" });
      save(); renderGrid();
    }
    return;
  }
  if (e.target.id === "clearGrid") {
    if (!confirm("清空今天的 24 格？（事件池不受影响）")) return;
    S.grid[todayStr()] = {};
    save(); renderGrid();
    return;
  }

  // 24 格：贴 / 擦
  const cell = e.target.closest(".hcell");
  if (cell) {
    const h = cell.dataset.h;
    const g = todayGrid();
    if (brush) {
      g[h] = brush;
      save(); renderGrid();
    } else if (g[h]) {
      delete g[h];
      save(); renderGrid();
    } else {
      toast("先从上面事件池选一个贴纸喵");
    }
    return;
  }

  // 列表视图
  const host = e.target.closest(".task");
  if (!host) return;
  const id = host.dataset.id;
  const inSteps = !!host.closest(".sect")?.querySelector("h2")?.textContent.includes("石子");
  const arr = inSteps ? S.steps : S.tasks;
  const t = arr.find(x => x.id === id);
  if (!t) return;
  const act = e.target.dataset.act;
  if (act === "toggle") {
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
    save(); render(t.done ? id : null);
    if (t.done) toast("✓ 搞定一件");
  } else if (act === "del") {
    arr.splice(arr.indexOf(t), 1);
    save(); render();
  }
});

document.querySelectorAll(".tab").forEach(el =>
  el.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    view = el.dataset.view;
    render();
  }));

document.getElementById("add").addEventListener("click", () => run("task"));
document.getElementById("split").addEventListener("click", () => run("split"));

document.getElementById("inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run("task"); }
});

document.querySelectorAll(".chips .chip").forEach(c =>
  c.addEventListener("click", () => {
    document.getElementById("inp").value = c.textContent;
    document.getElementById("inp").focus();
  }));

async function run(mode) {
  const inp = document.getElementById("inp");
  const text = inp.value.trim();
  if (!text) { toast("先跟苏苏说点什么喵"); return; }

  const btn = document.getElementById(mode === "task" ? "add" : "split");
  const orig = btn.textContent;
  btn.disabled = true; btn.innerHTML = `<span class="loading">◌</span> 想想…`;

  try {
    if (mode === "task") {
      const out = await askAI(SYS_TASK.replace("{{NOW}}", nowStr()), text);
      const items = (out.tasks || []).filter(t => t && t.title);
      if (!items.length) throw new Error("没解析出日程，换个说法试试喵");
      items.forEach(t => {
        let s = t.start || "", e2 = t.end || "";
        if (e2 && s && new Date(e2) <= new Date(s)) e2 = "";
        S.tasks.push({
          id: uid(), title: String(t.title).slice(0, 60), start: s, end: e2,
          note: String(t.note || "").slice(0, 120), done: false, createdAt: Date.now(),
        });
      });
      save(); render(); inp.value = "";
      toast(`建好了 ${items.length} 条 ✓`);
    } else {
      const out = await askAI(SYS_SPLIT.replace("{{NOW}}", nowStr()), text);
      const items = (out.steps || []).filter(s => s && s.title);
      if (!items.length) throw new Error("没拆出步骤，换个说法试试喵");
      items.forEach(s => S.steps.push({
        id: uid(), title: String(s.title).slice(0, 60),
        why: String(s.why || "").slice(0, 120), done: false, createdAt: Date.now(),
      }));
      save(); render(); inp.value = "";
      toast(`砸成 ${items.length} 颗小石子了 ✓`);
    }
  } catch (err) {
    toast(err.message || "出错了喵", 3200);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

/* ---------- 设置 ---------- */
const sheet = document.getElementById("sheet");
function openSheet() {
  document.getElementById("keyinp").value = S.apiKey || "";
  sheet.classList.add("show");
}
document.getElementById("gear").addEventListener("click", openSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.classList.remove("show"); });
document.getElementById("savekey").addEventListener("click", () => {
  S.apiKey = document.getElementById("keyinp").value.trim();
  save(); sheet.classList.remove("show");
  toast(S.apiKey ? "Key 存好了 ✓" : "已清空");
});

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

render();
</script>
